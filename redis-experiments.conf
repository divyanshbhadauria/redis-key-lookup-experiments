# Config for experiments: in-memory only, so persistence doesn't add noise
port 6379
bind 127.0.0.1
daemonize yes
pidfile data/redis.pid
logfile data/redis.log
save ""
appendonly no
# Let experiments use DEBUG POPULATE / DEBUG HTSTATS from localhost
enable-debug-command local
# Record any event slower than 1ms in LATENCY HISTORY
latency-monitor-threshold 1
slowlog-log-slower-than 1000
